name: Windows 11 + Tailscale + Secure RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 1 -Force
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          
      - name: Create RDP User with Secret Password
        run: |
          $password = "${{ secrets.RDP_PASSWORD }}"
          if (-not $password) { $password = "SecureP@ss1234!" }
          
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: Install Tailscale
        run: |
          $tsUrl = "https://tailscale.com"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          # Gushakisha inzira nyayo Tailscale yagiye itajanditswe mu buryo bwa hardcode
          $tsExe = (Get-Command tailscale.exe -ErrorAction SilentlyContinue).Source
          if (-not $tsExe) {
              $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          }
          if (-not (Test-Path $tsExe)) {
              $tsExe = "C:\Users\runneradmin\AppData\Local\Programs\Tailscale\tailscale.exe"
          }
          
          Write-Host "Using Tailscale path: $tsExe"
          
          # Gutangiza Tailscale ikoresheje inzira ihuye
          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & $tsExe ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Configure Firewall For Tailscale Only
        run: |
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10

      - name: Setup Downloads Startup Script (All Users)
        run: |
          $allUsersStartup = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp"
          $downloadUrl = "https://gitlab.com"
          $downloadPath = "$allUsersStartup\Downloads.bat"
          
          Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -UseBasicParsing
          Write-Host "✅ Downloads.bat copied successfully."

      - name: Display Connection Info
        run: |
          Write-Host "`n=== INSTRUCTIONS TO CONNECT ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "==============================`n"

      - name: Keep Runner Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP active..."
              Start-Sleep -Seconds 300
          }
